name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y MarkFlowy-macOS.zip MarkFlowy.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkFlowy-macOS
          path: build/macos/Build/Products/Release/MarkFlowy-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MarkFlowy-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkFlowy-Windows
          path: MarkFlowy-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MarkFlowy-macOS
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MarkFlowy-Windows
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            自动构建于 ${{ github.sha }}

            提交信息: ${{ github.event.head_commit.message }}
          make_latest: true
          prerelease: false
          files: |
            artifacts/MarkFlowy-macOS.zip
            artifacts/MarkFlowy-Windows.zip
