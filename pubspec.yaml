name: markflowy
description: "MarkFlowy - A Flutter cross-platform Markdown editor inspired by MarkText."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # 编辑器
  appflowy_editor: ^6.1.0
  flutter_highlight: ^0.7.0
  flutter_markdown: ^0.7.6
  markdown: ^7.2.2

  # 状态管理与路由
  flutter_riverpod: ^3.3.1
  go_router: ^17.0.0

  # 桌面支持
  window_manager: ^0.5.0
  file_picker: ^10.3.10
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # 导出
  pdf: ^3.11.3
  printing: ^5.11.0

  # 数学公式
  flutter_math_fork: ^0.7.2

  # UI
  fluent_ui: ^4.8.0
  cupertino_icons: ^1.0.6
  desktop_drop: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
